# WiFi (ESP32 native driver)
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=10
CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM=32
CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM=32
CONFIG_ESP32_WIFI_TX_BA_WIN=12
CONFIG_ESP32_WIFI_RX_BA_WIN=12
CONFIG_ESP32_WIFI_IRAM_OPT=y
CONFIG_ESP32_WIFI_RX_IRAM_OPT=y

# ESP32 needs more stack for WiFi operations
CONFIG_MAIN_STACK_SIZE=5200
CONFIG_SHELL_STACK_SIZE=5200

# Heap: WiFi driver needs ~51K, extra for runtime TX buffer allocs
CONFIG_HEAP_MEM_POOL_SIZE=81920

# Ensure enough file descriptors and eventfds for HTTP server
CONFIG_ZVFS_OPEN_MAX=24
CONFIG_ZVFS_EVENTFD_MAX=4




