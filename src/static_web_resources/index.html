<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>WiFi Speed Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
    }

    h1 {
      font-size: 18px;
      font-weight: 400;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .gauge {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 30px;
    }

    svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    circle {
      fill: none;
      stroke-width: 8;
    }

    .bg { stroke: #1a1a3e; }

    .fg {
      stroke: #00d4ff;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s;
    }

    .val {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .speed {
      font-size: 52px;
      font-weight: 700;
      color: #fff;
    }

    .unit {
      font-size: 14px;
      color: #888;
      margin-top: 2px;
    }

    .lbl {
      font-size: 13px;
      margin-top: 8px;
      height: 16px;
    }

    .chart-wrap {
      width: 90%;
      max-width: 480px;
      margin: 0 0 16px;
    }

    .chart-box {
      background: #0d0d24;
      border: 1px solid #1a1a3e;
      border-radius: 8px;
      padding: 8px;
    }

    .chart-hdr {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
    }

    canvas {
      width: 100%;
      height: 90px;
      display: block;
      border-radius: 4px;
    }

    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 6px;
      font-size: 11px;
      color: #888;
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: -1px;
    }

    .results {
      display: flex;
      gap: 50px;
      margin: 20px 0;
      font-size: 14px;
    }

    .results div { text-align: center; }

    .results span {
      display: block;
      font-size: 26px;
      font-weight: 600;
      color: #fff;
      margin-top: 4px;
    }

    .results small {
      font-size: 12px;
      color: #888;
    }

    button {
      background: #00d4ff;
      color: #0a0a1a;
      border: none;
      padding: 14px 52px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: default; }

    .st {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      height: 18px;
    }
  </style>
</head>
<body>
  <h1>WiFi Speed Test</h1>

  <div class="gauge">
    <svg viewBox="0 0 220 220">
      <circle class="bg" cx="110" cy="110" r="100"/>
      <circle class="fg" id="ring" cx="110" cy="110" r="100"
              stroke-dasharray="628" stroke-dashoffset="628"/>
    </svg>
    <div class="val">
      <div class="speed" id="spd">0.0</div>
      <div class="unit">Mbps</div>
      <div class="lbl" id="lbl">&nbsp;</div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-box">
      <div class="chart-hdr">
        <span>Speed over time</span>
        <span id="ymax"></span>
      </div>
      <canvas id="chart" height="90"></canvas>
    </div>
    <div class="legend">
      <span><i style="background:#00d4ff"></i>Download</span>
      <span><i style="background:#a855f7"></i>Upload</span>
    </div>
  </div>

  <div class="results">
    <div>Ping<span id="pg">--</span><small>ms</small></div>
    <div>Download<span id="dl">--</span><small>Mbps</small></div>
    <div>Upload<span id="ul">--</span><small>Mbps</small></div>
  </div>

  <button id="btn" onclick="run()">START</button>
  <div class="st" id="st"></div>

  <script>
    var CFG = {
      DL_STREAMS:     4,
      UL_STREAMS:     4,
      TRANSFER_BYTES: 4 * 1024 * 1024,
      PING_COUNT:     20,
      PING_WARMUP:    10,
      SPEED_WARMUP:   2000,
      SAMPLE_INTERVAL:0.1,
      SMOOTHING:      0.3,
      TRIM_FRACTION:  0.2,
      GAUGE_MAX:      10,
      UL_CHUNK_SIZE:  (8 * 1024)
    };

    var $ = function (id) { return document.getElementById(id); };
    var ring = $('ring'), C = 628;
    var cv = $('chart'), cx = cv.getContext('2d');
    var dlPts = [], ulPts = [];

    function fit() {
      var r = cv.getBoundingClientRect();
      cv.width = r.width * devicePixelRatio;
      cv.height = r.height * devicePixelRatio;
      cx.scale(devicePixelRatio, devicePixelRatio);
    }
    fit();

    function gauge(mbps) {
      $('spd').textContent = mbps.toFixed(1);
      ring.style.strokeDashoffset = C - C * Math.min(mbps / CFG.GAUGE_MAX, 1);
    }

    function draw() {
      var w = cv.width / devicePixelRatio;
      var h = cv.height / devicePixelRatio;
      cx.clearRect(0, 0, w, h);

      var peak = 0.5, i;
      for (i = 0; i < dlPts.length; i++) {
        if (dlPts[i] > peak) peak = dlPts[i];
      }
      for (i = 0; i < ulPts.length; i++) {
        if (ulPts[i] > peak) peak = ulPts[i];
      }
      peak = Math.ceil(peak * 1.2) || 1;
      $('ymax').textContent = peak + ' Mbps';

      cx.strokeStyle = '#1a1a3e';
      cx.lineWidth = 0.5;
      for (i = 1; i < 4; i++) {
        var gy = h - h * (i / 4);
        cx.beginPath();
        cx.moveTo(0, gy);
        cx.lineTo(w, gy);
        cx.stroke();
      }

      function line(pts, col, a) {
        if (pts.length < 2) return;
        var n = pts.length;
        cx.beginPath();
        cx.moveTo(0, h - h * (pts[0] / peak));
        for (var j = 1; j < n; j++) {
          cx.lineTo(w * j / (n - 1), h - h * (pts[j] / peak));
        }
        cx.strokeStyle = col;
        cx.lineWidth = 2;
        cx.stroke();
        cx.lineTo(w, h);
        cx.lineTo(0, h);
        cx.closePath();
        cx.fillStyle = col.replace(')', ',' + a + ')').replace('rgb', 'rgba');
        cx.fill();
      }

      line(dlPts, 'rgb(0,212,255)', 0.15);
      line(ulPts, 'rgb(168,85,247)', 0.15);
    }

    var smoothed = 0;

    function testPing() {
      var WARMUP = CFG.PING_WARMUP, TOTAL = WARMUP + CFG.PING_COUNT;
      return new Promise(function (resolve) {
        var times = [], i = 0;
        function next() {
          var t0 = performance.now();
          var x = new XMLHttpRequest();
          x.open('GET', '/api/ping?t=' + t0);
          x.onload = function () {
            if (i >= WARMUP) times.push(performance.now() - t0);
            i++;
            if (i < TOTAL) { next(); return; }
            times.sort(function (a, b) { return a - b; });
            var trim = Math.floor(times.length * CFG.TRIM_FRACTION);
            var trimmed = times.slice(trim, times.length - trim);
            if (!trimmed.length) trimmed = times;
            var sum = 0;
            for (var j = 0; j < trimmed.length; j++) sum += trimmed[j];
            resolve(sum / trimmed.length);
          };
          x.onerror = function () {
            i++;
            if (i < TOTAL) next(); else resolve(0);
          };
          x.send();
        }
        next();
      });
    }

    function trimmedMean(arr) {
      if (arr.length < 4) return arr.length ? arr[arr.length - 1] : 0;
      var sorted = arr.slice().sort(function (a, b) { return a - b; });
      var trim = Math.floor(sorted.length * CFG.TRIM_FRACTION);
      var s = 0, count = sorted.length - trim * 2;
      for (var j = trim; j < sorted.length - trim; j++) s += sorted[j];
      return s / count;
    }

    function createMeter(mode) {
      var isUp = (mode === 'ul');
      var pts = [];
      var t0 = 0, last = 0, prevBytes = 0, warmup = true;
      var steadyStart = 0, steadyBytes = 0;
      smoothed = 0;
      if (isUp) { ulPts = []; } else { dlPts = []; }

      function storePts() {
        if (isUp) { ulPts = pts; } else { dlPts = pts; }
      }

      return {
        sample: function (totalBytes) {
          var now = performance.now();
          if (!t0) { t0 = now; last = now; return; }
          var dt = (now - last) / 1000;
          if (dt < CFG.SAMPLE_INTERVAL) return;
          var m = (totalBytes - prevBytes) * 8 / 1e6 / dt;
          smoothed = smoothed ? smoothed * (1 - CFG.SMOOTHING) + m * CFG.SMOOTHING : m;
          gauge(smoothed);
          pts.push(smoothed);
          storePts();
          draw();
          if (warmup && (now - t0) < CFG.SPEED_WARMUP) { last = now; prevBytes = totalBytes; return; }
          if (warmup) {
            warmup = false;
            steadyStart = now;
            steadyBytes = totalBytes;
          }
          last = now;
          prevBytes = totalBytes;
        },
        finish: function (totalBytes) {
          var m = pts.length >= 4 ? trimmedMean(pts) : 0;
          if (!m) {
            var now = performance.now();
            if (steadyStart) {
              m = (totalBytes - steadyBytes) * 8 / 1e6 / ((now - steadyStart) / 1000);
            } else {
              m = totalBytes * 8 / 1e6 / ((now - t0) / 1000);
            }
          }
          pts.push(m);
          storePts();
          draw();
          return m;
        }
      };
    }

    function testSpeed(mode, n) {
      var isUp = (mode === 'ul');
      var perStream = CFG.TRANSFER_BYTES / n;
      return new Promise(function (resolve) {
        var meter = createMeter(mode);
        var done = 0, totalBytes = 0;

        if (isUp) {
          var ulChunk = CFG.UL_CHUNK_SIZE;
          function runStream(idx, remaining) {
            if (remaining <= 0) {
              done++;
              if (done >= n) resolve(meter.finish(totalBytes));
              return;
            }
            var sz = Math.min(ulChunk, remaining);
            var x = new XMLHttpRequest();
            x.open('POST', '/api/upload/' + idx);
            x.onload = function () {
              totalBytes += sz;
              meter.sample(totalBytes);
              runStream(idx, remaining - sz);
            };
            x.onerror = function () { done++; if (done >= n) resolve(0); };
            x.send(new Uint8Array(sz));
          }
          for (var i = 0; i < n; i++) runStream(i, perStream);
        } else {
          var bytes = new Array(n).fill(0);
          for (var i = 0; i < n; i++) {
            (function (idx) {
              var x = new XMLHttpRequest();
              x.open('GET', '/api/download/' + idx);
              x.responseType = 'arraybuffer';
              x.onprogress = function (e) {
                bytes[idx] = e.loaded;
                var sum = 0;
                for (var j = 0; j < n; j++) sum += bytes[j];
                meter.sample(sum);
              };
              x.onload = function () {
                bytes[idx] = x.response.byteLength;
                done++;
                if (done >= n) {
                  var sum = 0;
                  for (var j = 0; j < n; j++) sum += bytes[j];
                  resolve(meter.finish(sum));
                }
              };
              x.onerror = function () { done++; if (done >= n) resolve(0); };
              x.send();
            })(i);
          }
        }
      });
    }

    function run() {
      var b = $('btn');
      b.disabled = true;
      $('pg').textContent = '--';
      $('dl').textContent = '--';
      $('ul').textContent = '--';
      dlPts = [];
      ulPts = [];
      draw();

      ring.style.stroke = '#4ade80';
      $('lbl').textContent = 'PING';
      $('lbl').style.color = '#4ade80';
      $('st').textContent = 'Measuring latency...';
      gauge(0);

      testPing().then(function (ping) {
        $('pg').textContent = ping ? Math.round(ping) : '--';
        gauge(0);
        ring.style.stroke = '#00d4ff';
        $('lbl').textContent = 'DOWNLOAD';
        $('lbl').style.color = '#00d4ff';
        $('st').textContent = 'Testing download (' + CFG.DL_STREAMS + ' streams)...';
        return testSpeed('dl', CFG.DL_STREAMS);
      }).then(function (dl) {
        $('dl').textContent = dl.toFixed(1);
        gauge(0);
        ring.style.stroke = '#a855f7';
        $('lbl').textContent = 'UPLOAD';
        $('lbl').style.color = '#a855f7';
        $('st').textContent = 'Testing upload (' + CFG.UL_STREAMS + ' streams)...';
        return testSpeed('ul', CFG.UL_STREAMS);
      }).then(function (ul) {
        $('ul').textContent = ul.toFixed(1);
        gauge(0);
        $('lbl').innerHTML = '&nbsp;';
        ring.style.stroke = '#00d4ff';
        $('st').textContent = 'Complete';
        b.disabled = false;
      });
    }
  </script>
</body>
</html>
