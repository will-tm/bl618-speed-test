<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BL618 Speed Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a1a;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
    }

    h1 {
      font-size: 18px;
      font-weight: 400;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .gauge {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 30px;
    }

    svg {
      position: absolute;
      inset: 0;
      transform: rotate(-90deg);
    }

    circle {
      fill: none;
      stroke-width: 8;
    }

    .bg { stroke: #1a1a3e; }

    .fg {
      stroke: #00d4ff;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s;
    }

    .val {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .speed {
      font-size: 52px;
      font-weight: 700;
      color: #fff;
    }

    .unit {
      font-size: 14px;
      color: #888;
      margin-top: 2px;
    }

    .lbl {
      font-size: 13px;
      margin-top: 8px;
      height: 16px;
    }

    .chart-wrap {
      width: 90%;
      max-width: 480px;
      margin: 0 0 16px;
    }

    .chart-box {
      background: #0d0d24;
      border: 1px solid #1a1a3e;
      border-radius: 8px;
      padding: 8px;
    }

    .chart-hdr {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #555;
      margin-bottom: 4px;
    }

    canvas {
      width: 100%;
      height: 90px;
      display: block;
      border-radius: 4px;
    }

    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 6px;
      font-size: 11px;
      color: #888;
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: -1px;
    }

    .results {
      display: flex;
      gap: 50px;
      margin: 20px 0;
      font-size: 14px;
    }

    .results div { text-align: center; }

    .results span {
      display: block;
      font-size: 26px;
      font-weight: 600;
      color: #fff;
      margin-top: 4px;
    }

    .results small {
      font-size: 12px;
      color: #888;
    }

    button {
      background: #00d4ff;
      color: #0a0a1a;
      border: none;
      padding: 14px 52px;
      border-radius: 30px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: default; }

    .st {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      height: 18px;
    }
  </style>
</head>
<body>
  <h1>BL618 WiFi Speed Test</h1>

  <div class="gauge">
    <svg viewBox="0 0 220 220">
      <circle class="bg" cx="110" cy="110" r="100"/>
      <circle class="fg" id="ring" cx="110" cy="110" r="100"
              stroke-dasharray="628" stroke-dashoffset="628"/>
    </svg>
    <div class="val">
      <div class="speed" id="spd">0.0</div>
      <div class="unit">Mbps</div>
      <div class="lbl" id="lbl">&nbsp;</div>
    </div>
  </div>

  <div class="chart-wrap">
    <div class="chart-box">
      <div class="chart-hdr">
        <span>Speed over time</span>
        <span id="ymax"></span>
      </div>
      <canvas id="chart" height="90"></canvas>
    </div>
    <div class="legend">
      <span><i style="background:#00d4ff"></i>Download</span>
      <span><i style="background:#a855f7"></i>Upload</span>
    </div>
  </div>

  <div class="results">
    <div>Download<span id="dl">--</span><small>Mbps</small></div>
    <div>Upload<span id="ul">--</span><small>Mbps</small></div>
  </div>

  <button id="btn" onclick="run()">START</button>
  <div class="st" id="st"></div>

  <script>
    var $ = function (id) { return document.getElementById(id); };
    var ring = $('ring'), C = 628, MAX = 20;
    var cv = $('chart'), cx = cv.getContext('2d');
    var dlPts = [], ulPts = [];

    function fit() {
      var r = cv.getBoundingClientRect();
      cv.width = r.width * devicePixelRatio;
      cv.height = r.height * devicePixelRatio;
      cx.scale(devicePixelRatio, devicePixelRatio);
    }
    fit();

    function gauge(mbps) {
      $('spd').textContent = mbps.toFixed(1);
      ring.style.strokeDashoffset = C - C * Math.min(mbps / MAX, 1);
    }

    function draw() {
      var w = cv.width / devicePixelRatio;
      var h = cv.height / devicePixelRatio;
      cx.clearRect(0, 0, w, h);

      var peak = 0.5, i;
      for (i = 0; i < dlPts.length; i++) {
        if (dlPts[i] > peak) peak = dlPts[i];
      }
      for (i = 0; i < ulPts.length; i++) {
        if (ulPts[i] > peak) peak = ulPts[i];
      }
      peak = Math.ceil(peak * 1.2) || 1;
      $('ymax').textContent = peak + ' Mbps';

      cx.strokeStyle = '#1a1a3e';
      cx.lineWidth = 0.5;
      for (i = 1; i < 4; i++) {
        var gy = h - h * (i / 4);
        cx.beginPath();
        cx.moveTo(0, gy);
        cx.lineTo(w, gy);
        cx.stroke();
      }

      function line(pts, col, a) {
        if (pts.length < 2) return;
        var n = pts.length;
        cx.beginPath();
        cx.moveTo(0, h - h * (pts[0] / peak));
        for (var j = 1; j < n; j++) {
          cx.lineTo(w * j / (n - 1), h - h * (pts[j] / peak));
        }
        cx.strokeStyle = col;
        cx.lineWidth = 2;
        cx.stroke();
        cx.lineTo(w, h);
        cx.lineTo(0, h);
        cx.closePath();
        cx.fillStyle = col.replace(')', ',' + a + ')').replace('rgb', 'rgba');
        cx.fill();
      }

      line(dlPts, 'rgb(0,212,255)', 0.15);
      line(ulPts, 'rgb(168,85,247)', 0.15);
    }

    function testDL() {
      return new Promise(function (resolve) {
        dlPts = [];
        var x = new XMLHttpRequest();
        x.open('GET', '/api/download');
        x.responseType = 'arraybuffer';
        var t0 = 0, loaded0 = 0, last = 0;

        x.onprogress = function (e) {
          if (e.loaded > 0) {
            var now = performance.now();
            if (!t0) {
              t0 = now;
              loaded0 = e.loaded;
              last = now;
              return;
            }
            var s = (now - t0) / 1000;
            if (s < 0.01) return;
            var m = (e.loaded - loaded0) * 8 / 1e6 / s;
            gauge(m);
            if (now - last > 250) {
              dlPts.push(m);
              draw();
              last = now;
            }
          }
        };

        x.onload = function () {
          if (!t0) { resolve(0); return; }
          var s = (performance.now() - t0) / 1000;
          var m = (x.response.byteLength - loaded0) * 8 / 1e6 / s;
          dlPts.push(m);
          draw();
          resolve(m);
        };

        x.onerror = function () { resolve(0); };
        x.send();
      });
    }

    function testUL() {
      return new Promise(function (resolve) {
        ulPts = [];
        var d = new Uint8Array(2 * 1024 * 1024);
        var x = new XMLHttpRequest();
        x.open('POST', '/api/upload');
        var t0 = 0, loaded0 = 0, last = 0, lastSpeed = 0;

        x.upload.onprogress = function (e) {
          if (e.loaded > 0) {
            var now = performance.now();
            if (!t0) {
              t0 = now;
              loaded0 = e.loaded;
              last = now;
              return;
            }
            var s = (now - t0) / 1000;
            if (s < 0.01) return;
            var m = (e.loaded - loaded0) * 8 / 1e6 / s;
            lastSpeed = m;
            gauge(m);
            if (now - last > 250) {
              ulPts.push(m);
              draw();
              last = now;
            }
          }
        };

        x.onload = function () {
          if (!t0) { resolve(0); return; }
          ulPts.push(lastSpeed);
          draw();
          resolve(lastSpeed);
        };

        x.onerror = function () { resolve(0); };
        x.send(d);
      });
    }

    function run() {
      var b = $('btn');
      b.disabled = true;
      $('dl').textContent = '--';
      $('ul').textContent = '--';
      dlPts = [];
      ulPts = [];
      draw();

      ring.style.stroke = '#00d4ff';
      $('lbl').textContent = 'DOWNLOAD';
      $('lbl').style.color = '#00d4ff';
      $('st').textContent = 'Testing download (2 MB)...';
      gauge(0);

      testDL().then(function (dl) {
        $('dl').textContent = dl.toFixed(1);
        gauge(0);
        ring.style.stroke = '#a855f7';
        $('lbl').textContent = 'UPLOAD';
        $('lbl').style.color = '#a855f7';
        $('st').textContent = 'Testing upload (2 MB)...';
        return testUL();
      }).then(function (ul) {
        $('ul').textContent = ul.toFixed(1);
        gauge(0);
        $('lbl').innerHTML = '&nbsp;';
        ring.style.stroke = '#00d4ff';
        $('st').textContent = 'Complete';
        b.disabled = false;
      });
    }
  </script>
</body>
</html>
